<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EVENTS</title>
    <!-- Link to static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="login-container">

        <!-- Forgot Password Form -->
        <div class="login-card" id="forgot-card">
            <h2 class="form-title">Reset Password</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;">
                Please verify your identity using your profile details.
            </p>
            <form method="POST" action="{{ url_for('forgot_password') }}">

                <div class="input-group">
                    <label for="username">User ID</label>
                    <input type="text" id="username" name="username" class="input-field" required>
                </div>

                <div class="input-group">
                    <label for="college_id">Registered College ID</label>
                    <input type="text" id="college_id" name="college_id" class="input-field" required
                        placeholder="e.g. BCA-2024-001">
                </div>

                <div class="input-group">
                    <label for="phone">Registered Phone Number</label>
                    <input type="text" id="phone" name="phone" class="input-field" required
                        placeholder="e.g. 9876543210">
                </div>

                <div class="input-group" style="margin-top: 1.5rem;">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="input-field" required>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="input-field" required>
                </div>

                {% if error %}
                <p class="error-msg"
                    style="color: #ff4444; background: rgba(255, 68, 68, 0.1); padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 1rem; border: 1px solid rgba(255, 68, 68, 0.3);">
                    {{ error }}</p>
                {% endif %}

                <button type="submit" class="btn-primary" style="margin-top: 1rem;">RESET PASSWORD</button>

                <div style="text-align: center; margin-top: 1rem;">
                    <a href="{{ url_for('login') }}"
                        style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Back to Login</a>
                </div>
            </form>
        </div>

    </div>

</body>

</html>
